# Tự triển khai không cần gõ lệnh (docs/ops/auto-deploy.md). Hai cách chạy:
#   1. Tự động: CI trên main xanh -> dựng và đẩy ảnh gắn tag sha-<7 ký tự> lên GHCR -> SSH vào máy chủ chạy deploy.sh (cuốn chiếu,
#      không gián đoạn, tự hoàn lại nếu bản mới không khoẻ).
#   2. Tay (Actions -> deploy -> Run workflow): triển khai lại một tag đã có, hoặc hoàn lại về tag cũ.
# Cần thiết lập MỘT lần bằng MỘT lệnh chạy trên máy chủ (deploy/scripts/setup-ci-deploy.sh, xem docs/ops/auto-deploy.md): secrets DEPLOY_HOST,
# DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS; tuỳ chọn variable PUBLIC_URL (kiểm ngoài sau khi triển khai), DEPLOY_USER (mặc định root), DEPLOY_PORT (22; đặt ở variable hoặc secret đều được). Chưa đặt secrets thì job triển khai báo thiếu và dừng, không làm hỏng gì.
# Khoá SSH của CI bị khoá bằng lệnh bắt buộc (cửa vào deploy/scripts/remote-deploy.sh, chép tới /usr/local/sbin/mihato-remote-deploy): chỉ làm được deploy <tag> <sha> và rollback <tag>.
name: deploy
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      action:
        description: deploy (triển khai lại tag đã có) hoặc rollback (hoàn lại tag cũ)
        type: choice
        options: [deploy, rollback]
        default: deploy
      tag:
        description: Tag ảnh, ví dụ v1.0.0 hoặc sha-abcdef0 (bắt buộc khi chạy tay)
        required: true
        type: string

permissions:
  contents: read
  packages: write

# Hai lần triển khai không bao giờ chạy cùng lúc; lần sau xếp hàng chờ lần trước, không huỷ giữa chừng.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  plan:
    # Tự động chỉ khi CI của một lần ĐẨY lên main đã xanh (không chạy cho PR, không chạy cho lịch ban đêm).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      action: ${{ steps.p.outputs.action }}
      tag: ${{ steps.p.outputs.tag }}
      sha: ${{ steps.p.outputs.sha }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          IN_ACTION: ${{ inputs.action }}
          IN_TAG: ${{ inputs.tag }}
          THIS_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_run ]; then
            action=deploy; sha="$RUN_SHA"; tag="sha-${RUN_SHA:0:7}"; build=true
          else
            action="$IN_ACTION"; tag="$IN_TAG"; sha="$THIS_SHA"; build=false
            [[ "$tag" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.]+)?|sha-[0-9a-f]{7,40})$ ]] || { echo "tag không hợp lệ: $tag"; exit 1; }
          fi
          { echo "action=$action"; echo "tag=$tag"; echo "sha=$sha"; echo "build=$build"; } >> "$GITHUB_OUTPUT"
          echo "Kế hoạch: $action $tag (commit $sha)"

  images:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: runtime, image: dieuhanh-server }
          - { target: web, image: dieuhanh-web }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tên ảnh Docker phải viết thường, mà tên tổ chức GitHub có thể có chữ hoa (mihato-Tech): đổi sang chữ thường trước khi ghép tag.
      - id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.owner.outputs.name }}/${{ matrix.image }}:${{ needs.plan.outputs.tag }}
          build-args: GIT_SHA=${{ needs.plan.outputs.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: false

  deploy:
    needs: [plan, images]
    # images bị bỏ qua khi chạy tay (ảnh đã có); chỉ dừng nếu dựng ảnh thất bại.
    if: always() && needs.plan.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Tạo environment tên "production" ở Settings -> Environments nếu muốn thêm nút duyệt tay trước khi triển khai (không bắt buộc).
    environment: production
    steps:
      - name: Kiểm đã thiết lập secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for v in HOST KEY KNOWN; do
            [ -n "${!v}" ] || { echo "::error::Thiếu secret DEPLOY_* ($v). Làm theo docs/ops/auto-deploy.md, mục Thiết lập một lần."; exit 1; }
          done
      - name: Triển khai qua SSH (lệnh bắt buộc, không mở shell)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          SSH_USER: ${{ vars.DEPLOY_USER || 'root' }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || secrets.DEPLOY_PORT || '22' }}
          ACTION: ${{ needs.plan.outputs.action }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          # Cổng không phải bí mật: in ra để lỗi "port 22" biết ngay biến DEPLOY_PORT có được đọc hay không.
          echo "Cổng SSH dùng để triển khai: $SSH_PORT (từ variable hoặc secret DEPLOY_PORT; không đặt thì mặc định 22)"
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts
          if [ "$ACTION" = rollback ]; then CMD="rollback $TAG"; else CMD="deploy $TAG $SHA"; fi
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$SSH_USER@$HOST" "$CMD"
      - name: Kiểm ngoài sau khi triển khai
        if: vars.PUBLIC_URL != ''
        env:
          URL: ${{ vars.PUBLIC_URL }}
        run: curl -fsS --retry 6 --retry-delay 5 --retry-connrefused "${URL%/}/readyz"
