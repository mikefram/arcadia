# Phát hành: đẩy tag v* (ví dụ v1.0.0) thì dựng và đẩy hai ảnh lên GHCR:
#   ghcr.io/<chủ>/dieuhanh-server   (api, worker, scribe, migrate; chọn tiến trình bằng command)
#   ghcr.io/<chủ>/dieuhanh-web      (Caddy và web quản trị)
# Mỗi ảnh gắn tag: <tag git> và sha-<7 ký tự>. Triển khai: deploy/scripts/deploy.sh <tag> (docs/ops/runbook.md).
# Phụ thuộc: repo trên GitHub; Settings, Actions, Workflow permissions cho phép ghi packages. Chưa chạy lần nào.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: runtime, image: dieuhanh-server }
          - { target: web, image: dieuhanh-web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          provenance: true
