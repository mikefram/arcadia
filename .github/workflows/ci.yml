# Chuỗi CI theo SPEC 12.3: kiểm kiểu và lint, test đơn vị, test thuộc tính của engine, test tích hợp với
# PostgreSQL thật, kiểm hợp đồng OpenAPI, kiểm migration lệch schema, dựng web và ảnh Docker. CI KHÔNG gọi nhà cung cấp
# trả phí: mọi nhà cung cấp là bản giả (FakeStt, FakeTts, FakeLlm, FakePush). Mục tiêu: không quá 10 phút [MỤC TIÊU].
# Ban đêm (schedule): engine 10.000 mẫu mỗi thuộc tính. Playwright chạy ở e2e-nightly.yml. Phát hành: release.yml.
name: ci
on:
  push:
  pull_request:
  schedule:
    # 19:17 UTC = 02:17 giờ Việt Nam
    - cron: '17 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev
        ports: ['5455:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      STT_PROVIDER: fake
      LLM_PROVIDER: fake
      TTS_PROVIDER: fake
      PUSH_PROVIDER: fake
      EMAIL_PROVIDER: fake
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vai trò CSDL và CSDL thử nghiệm
        run: PGPASSWORD=postgres_dev psql -h 127.0.0.1 -p 5455 -U postgres -f db/init/00_roles.sql
      - run: pnpm -w lint
      - run: pnpm -w typecheck
      - name: Chuỗi giao diện (từ cấm, đủ mã lỗi)
        run: pnpm check:i18n
      - name: Migration không xung đột (snapshot và journal)
        run: pnpm db:check
      - name: Migration mới không phá vỡ bản cũ (đổi bản không gián đoạn)
        # Hai bản chạy song song lúc đổi bản; migration bỏ cột, đổi tên, NOT NULL không DEFAULT làm bản cũ hỏng. Xem deploy/ci/migration-guard.mjs.
        run: |
          node --test deploy/ci/migration-guard.test.mjs
          node deploy/ci/migration-guard.mjs
      - name: Schema khớp migration (sửa schema.ts phải sinh migration)
        # drizzle-kit check một mình KHÔNG thấy schema.ts lệch migration; generate rồi xem thư mục có đổi không mới thấy.
        run: |
          pnpm db:generate --name ci_drift_check
          if [ -n "$(git status --porcelain db/migrations)" ]; then
            echo "::error::schema.ts lệch migration: chạy pnpm db:generate -- --name <tên> rồi commit cả SQL lẫn meta/"
            git status --porcelain db/migrations
            exit 1
          fi
      - name: Migration từ CSDL trống
        run: pnpm db:migrate
      - name: Test (đơn vị, thuộc tính, tích hợp, kịch bản vàng)
        run: pnpm -w test
      - name: Hợp đồng OpenAPI khớp bản đã duyệt
        run: pnpm --filter @mihato/api openapi -- --check
      - name: Dựng web quản trị
        run: pnpm --filter @mihato/web-admin build
      # Quét phụ thuộc. Hiện có 2 lỗ hổng mức high (node-forge, braces) chỉ nằm trong chuỗi công cụ Expo của hai app di động,
      # chưa có bản vá (kiểm 07/10/2026). Phần máy chủ và web phải sạch: audit-gate chặn nếu có lỗ hổng mức high ở ngoài apps/mobile-*.
      - name: Quét phụ thuộc (critical chặn mọi nơi)
        run: pnpm audit --prod --audit-level critical
      - name: Quét phụ thuộc (high chặn ở máy chủ và web)
        run: pnpm audit --prod --json | node deploy/ci/audit-gate.mjs
      - name: Quét phụ thuộc (high toàn workspace, chỉ báo)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  # Dựng đủ ba đích của Dockerfile, KHÔNG đẩy. Bắt lỗi lockfile, thiếu manifest, lỗi dựng web trước khi phát hành.
  docker:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Dựng ảnh runtime (api, worker, scribe)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: mihato-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - name: Dựng ảnh web (Caddy và web quản trị)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          push: false
          load: true
          tags: mihato-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Ảnh chạy bằng người dùng không phải root, không có công cụ phát triển
        run: |
          test "$(docker run --rm --entrypoint id mihato-server:ci -u)" != "0"
          docker run --rm --entrypoint sh mihato-server:ci -c 'test ! -d node_modules/vitest && test ! -d node_modules/eslint && node --import tsx -e "console.log(\"tsx chạy được\")"'
          docker run --rm --entrypoint sh mihato-server:ci -c 'test -f packages/backend/assets/fonts/Tinos_400Regular.ttf && test -d db/migrations && test ! -e db/seed/activation-links.txt && test ! -e .env'
          docker image ls mihato-server:ci
          docker image ls mihato-web:ci
      - name: Caddyfile hợp lệ
        run: |
          docker run --rm -e DOMAIN=example.vn -e ACME_EMAIL=ops@example.vn --entrypoint caddy mihato-web:ci validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Compose production hợp lệ
        run: |
          printf '%s\n' DOMAIN=example.vn ACME_EMAIL=ops@example.vn TAG=ci AUTH_SECRET=x INTERNAL_SERVICE_TOKEN=x POSTGRES_PASSWORD=x APP_OWNER_PASSWORD=x APP_USER_PASSWORD=x APP_SCAN_PASSWORD=x > /tmp/ci.env
          docker compose --env-file /tmp/ci.env -f deploy/compose.production.yml --profile tools config -q
          # Biến thể chạy sau proxy chung (MIHATO_COMPOSE_EXTRA=compose.edge.yml) cũng phải gộp được.
          docker compose --env-file /tmp/ci.env -f deploy/compose.production.yml -f deploy/compose.edge.yml --profile tools config -q
      - name: Script triển khai (cú pháp, shellcheck)
        run: |
          for f in deploy/scripts/*.sh deploy/postgres/*.sh; do bash -n "$f"; done
          sudo apt-get install -y --no-install-recommends shellcheck >/dev/null
          shellcheck -x -S warning deploy/scripts/*.sh deploy/postgres/*.sh deploy/ci/test-rollout.sh
      - name: Logic đổi bản không gián đoạn (docker giả)
        # Chứng minh: bản mới khoẻ rồi mới tắt bản cũ; bản mới hỏng thì bản cũ không bị đụng. Xem deploy/ci/test-rollout.sh.
        run: bash deploy/ci/test-rollout.sh

  secrets:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Dùng thẳng ảnh gitleaks (miễn phí). gitleaks-action v2 đòi GITLEAKS_LICENSE khi repo thuộc GitHub Organization.
      - name: Quét bí mật trong lịch sử git
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --redact --verbose

  engine-nightly:
    # Ban đêm: 10.000 mẫu mỗi thuộc tính (SPEC 13.1 [QUYẾT ĐỊNH]).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mihato/workflow-engine test:nightly
